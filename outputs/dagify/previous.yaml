      Brief textual summary of testing results, including key findings and recommendations.\"\
      )\n\n\nclass IntegrateChessEngineOutput(BaseModel):\n    \"\"\"Pydantic model\
      \ for integrate_chess_engine node outputs.\"\"\"\n    integration_status: bool\
      \ = Field(..., description=\"Whether the integration was successful\")\n   \
      \ chess_engine_used: str = Field(..., description=\"The name of the chess engine\
      \ used for integration\")\n    issues_encountered: List[str] = Field(..., description=\"\
      List of issues encountered during integration\")\n    verification_result: bool\
      \ = Field(..., description=\"Whether the verification of chess moves and rules\
      \ was successful\")\n\n\nclass DocumentChessApplicationOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for document_chess_application node outputs.\"\"\"\
      \n    user_manual_sections: List[str] = Field(..., description=\"Sections included\
      \ in the user manual, such as Setup, Rules, Features, FAQ.\")\n    api_endpoints:\
      \ List[str] = Field(..., description=\"List of API endpoints with their HTTP\
      \ methods.\")\n    manual_version: str = Field(..., description=\"Version identifier\
      \ of the user manual.\")\n    api_version: str = Field(..., description=\"Version\
      \ identifier of the API documentation.\")\n    is_manual_complete: bool = Field(...,\
      \ description=\"Whether the user manual has been fully written.\")\n    is_api_documented:\
      \ bool = Field(..., description=\"Whether the API documentation has been fully\
      \ written.\")\n\n\ndef document_chess_application(test_chess_application_input:\
      \ TestChessApplicationOutput, integrate_chess_engine_input: IntegrateChessEngineOutput,\
      \ **kwargs) -> DocumentChessApplicationOutput:\n    \"\"\"Create a comprehensive\
      \ user manual and API documentation for the chess application.\n\n    Args:\n\
      \        test_chess_application_input: Input from the 'test_chess_application'\
      \ node.\n        integrate_chess_engine_input: Input from the 'integrate_chess_engine'\
