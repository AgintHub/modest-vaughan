dag_type: plain_text
description: A workflow that summarizes emails into concise summaries
name: email_summarizer_workflow
nodes:
  determine_email_intent:
    agent: false
    description: Determine the intent or purpose of the email
    name: determine_email_intent
    nodes_depended_on:
    - extract_email_content
    nodes_dependent_on: []
    prompt: Analyze the email content to determine its intent or purpose.
  extract_email_content:
    agent: false
    description: Extract the content of the email
    name: extract_email_content
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Extract the body content from the given email.
  format_summary:
    agent: false
    description: Format the summary into a readable format
    name: format_summary
    nodes_depended_on:
    - summarize_email_content
    nodes_dependent_on: []
    prompt: Format the summary into a clear and readable format.
  identify_key_entities:
    agent: false
    description: Identify key entities mentioned in the email
    name: identify_key_entities
    nodes_depended_on:
    - extract_email_content
    nodes_dependent_on: []
    prompt: Identify and list the key entities (people, organizations, locations)
      mentioned in the email content.
  output_summary:
    agent: false
    description: Output the final summary
    name: output_summary
    nodes_depended_on:
    - format_summary
    nodes_dependent_on: []
    prompt: Output the final formatted summary.
  summarize_email_content:
    agent: false
    description: Summarize the email content into a concise summary
    name: summarize_email_content
    nodes_depended_on:
    - extract_email_content
    - identify_key_entities
    - determine_email_intent
    nodes_dependent_on: []
    prompt: Using the extracted content, identified entities, and determined intent,
      create a concise summary of the email.
