      - complexity: MEDIUM
        impact: HIGH
        method: Use `torch.nn.Sequential` to build the MLP; ensure its output dimension
          matches the base head output dimension.
        reason: The delta head is the only trainable component that learns residual
          corrections for each material.
        text: Instantiate the delta head according to the architecture specified by
          `implement_delta_head` (e.g., two‑layer MLP with defined input/output sizes
          and activations). Register its parameters with the delta‑head optimizer.
      - complexity: MEDIUM
        impact: MEDIUM
        method: 'Read `exemplar_file_paths`; store a mapping `{class_id: [tensor,
          label]}`; implement a `sample(num_samples)` method that returns a balanced
          batch.'
        reason: Replay buffer must be ready to supply past exemplars during each incremental
          epoch.
        text: Set up the memory replay buffer using the artifact from `set_up_memory_replay_buffer`
          (directory path, exemplars per class). Load any pre‑existing exemplars into
          an in‑memory index for fast sampling.
      - complexity: LOW
        impact: HIGH
        method: For `material_idx, material_name in enumerate(materials):` execute
          the training loop described in subsequent bullets.
        reason: Continual learning requires a deterministic material ordering for
          reproducibility and for correct forgetting measurement later.
        text: Iterate over the list of new materials returned by `collect_new_material_datasets.materials`
          in the order they will be introduced.
      - complexity: LOW
        impact: HIGH
        method: Use `torch.utils.data.Dataset` subclass that reads image paths, applies
          the preprocessing pipeline, and returns tensors.
        reason: Provides the fresh data on which the prompt and delta head will be
          optimized.
        text: For the current material, load its training split JSON file (path from
          `split_datasets.train_split_json_paths` matched by material name) into a
