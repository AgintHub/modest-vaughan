          preserving knowledge from earlier materials.
        text: "Compute the combined loss for the batch:\n   - Classification loss:\
          \ cross‑entropy between `logits` and true labels for both new and replay\
          \ samples.\n   - Distillation loss: KL‑divergence between `logits` (student)\
          \ and stored base‑model logits for replay samples, weighted by `weighting_hyperparameter`\
          \ from `define_knowledge_distillation_loss`.\n   - Total loss = `classification_loss\
          \ + λ * distillation_loss`."
      - complexity: LOW
        impact: HIGH
        method: Call `optimizer_prompt.zero_grad(); optimizer_delta.zero_grad(); total_loss.backward();
          optimizer_prompt.step(); optimizer_delta.step();`.
        reason: Maintains the frozen‑backbone constraint while updating only the intended
          components.
        text: Back‑propagate the total loss **only** through prompt parameters and
          delta head parameters (optimizers created earlier). Ensure that the backbone
          and base head gradients are disabled (they remain `requires_grad=False`).
      - complexity: HIGH
        impact: MEDIUM
        method: Implement a FIFO or herding strategy; compute embeddings for candidate
          exemplars using the frozen backbone, then select via k‑means centroids or
          loss‑based ranking.
        reason: Keeps the replay buffer representative of all learned materials and
          provides the necessary teacher logits for distillation.
        text: "After each epoch, update the replay buffer:\n   - For each class in\
