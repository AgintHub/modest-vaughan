dag_type: spec
description: Generated workflow from UI.
name: cliff_continual_learning_workflow
nodes:
  collect_new_material_datasets:
    agent: false
    description: Gather labeled optical‑microscopy datasets for each additional 2D
      material that will be introduced sequentially.
    name: collect_new_material_datasets
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: Names of the new 2D materials for which datasets are collected
        (e.g., MoS2, WS2, h‑BN).
      key: materials
      type: List[str]
    - description: Brief description of the acquisition procedure for each material
        (e.g., microscope settings, substrate preparation).
      key: collection_methods
      type: List[str]
    - description: Annotation protocol for each material, specifying label categories
        such as layer count, defects, and image quality criteria.
      key: annotation_guidelines
      type: List[str]
    - description: Filesystem or cloud directory path where the labeled image set
        for each material is saved.
      key: storage_paths
      type: List[str]
    - description: Recommended train/validation/test split for each material expressed
        as a string (e.g., "70/15/15").
      key: split_ratios
      type: List[str]
    - description: Number of images collected for each material after filtering and
        quality control.
      key: total_image_counts
      type: List[int]
    - description: Flag indicating whether all datasets have been collected, annotated,
        split, and stored correctly.
      key: is_dataset_ready
      type: bool
    prd:
      bullets:
      - complexity: LOW
        impact: HIGH
        method: Consult recent 2D‑material review papers; create a table mapping material
          → typical flake thickness range; confirm substrate compatibility (SiO2/Si).
        reason: Choosing well‑studied materials ensures that reference data exists
          and that downstream models have meaningful class diversity.
        text: Select three target 2D materials (MoS2, WS2, h‑BN) based on literature
          prevalence and availability of exfoliation sources.
      - complexity: MEDIUM
        impact: MEDIUM
        method: Write SOP document; include cleaning steps (piranha, acetone, IPA),
          bake temperature (150 °C, 5 min), and storage conditions; store SOP as markdown
          in repo.
        reason: Consistent substrate preparation reduces systematic imaging variance
          across materials, facilitating fair model comparison.
        text: Define standard substrate preparation protocol for each material (clean
          SiO2 wafer, spin‑coat PMMA optional, annealing temperature).
      - complexity: LOW
        impact: HIGH
        method: Create a calibration checklist; capture a reference grid image before
          each acquisition session; log settings in a CSV file per session.
        reason: Uniform imaging settings enable direct pixel‑wise comparison and reduce
          domain shift when training the backbone.
        text: 'Specify optical‑microscope configuration: illumination type (bright‑field),
          objective magnification (50×), numerical aperture (0.8), exposure time (10 ms),
          pixel resolution (0.2 µm/pixel).'
      - complexity: MEDIUM
        impact: HIGH
        method: 'Use a spreadsheet tracker with columns: material, session_id, image_id,
          flake_id, target_layer_count; aim for ~1,000 images per layer class (1‑5 L).'
        reason: A minimum sample size guarantees statistical significance for class‑balance
          during stratified splitting.
        text: 'Create a data‑capture schedule: for each material, acquire at least
          5,000 raw images covering different flake sizes, orientations, and defect
          types.'
      - complexity: MEDIUM
        impact: HIGH
        method: Write a 2‑page protocol, include example annotated images; integrate
          into labeling tool (e.g., Labelbox) with mandatory fields; enforce validation
          scripts to reject out‑of‑range values.
        reason: Clear, reproducible annotation rules ensure high inter‑annotator agreement
          and reliable downstream training.
        text: 'Develop annotation guidelines: define label taxonomy (layer_count ∈
          {1,2,3,4,5}, defect_type ∈ {none, tear, wrinkle, contamination}), image_quality
          thresholds (SNR > 10 dB, no motion blur).'
      - complexity: MEDIUM
        impact: MEDIUM
        method: Automate assignment using a Python script that pulls image paths from
          the capture directory; schedule weekly review meetings; store final CSV
          in <project_root>/metadata/<material>_labels.csv.
        reason: Dual‑annotation plus arbitration reduces labeling errors and provides
          a reliability metric (Cohen’s κ).
        text: 'Execute labeling workflow: assign two independent annotators per image,
          resolve conflicts via a senior reviewer, and export consolidated CSV per
          material.'
      - complexity: LOW
        impact: HIGH
        method: Use gsutil to sync local folders; generate manifest via a Bash/Python
          one‑liner that computes SHA256 for each file; commit manifest to Git.
        reason: Centralized, immutable storage simplifies reproducibility and enables
          downstream pipeline access across compute nodes.
        text: 'Store each material’s labeled dataset in a version‑controlled cloud
          bucket (e.g., gs://cliff-datasets/<material>/) using a directory layout:
          raw/, annotated/, splits/. Include a manifest JSON summarizing counts and
          hash values.'
      - complexity: LOW
        impact: MEDIUM
        method: Implement a Python function using sklearn.model_selection.StratifiedShuffleSplit;
          output three JSON files (train_<material>.json, val_<material>.json, test_<material>.json)
          containing file paths and label metadata.
        reason: Stratification preserves class distribution, preventing skewed performance
          metrics.
        text: Perform stratified train/validation/test split per material with a 70/15/15
          ratio, ensuring each layer class is proportionally represented in each split.
      - complexity: LOW
        impact: HIGH
        method: Write a final aggregation script that reads the manifest, counts images
          per material, validates existence of split JSONs, and writes a single JSON
          payload matching the Output Structure schema.
        reason: Fulfilling the defined output structure is required for downstream
          nodes to consume the data correctly.
        text: 'Populate the output fields: list of material names, collection method
          strings, annotation guideline summaries, storage paths, split ratio strings,
          total image counts after QC, and set is_dataset_ready = true only if all
          previous steps succeeded without errors.'
    prompt: Outline how to collect, annotate, and store separate labeled image sets
      for at least three new 2D materials (e.g., MoS2, WS2, h‑BN). Include data‑split
      recommendations.
  collect_reference_material_dataset:
    agent: false
    description: Gather a labeled optical‑microscopy dataset for the reference 2D
      material that will be used to pre‑train the backbone and base head.
    name: collect_reference_material_dataset
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: A short identifier for the collected dataset (e.g., "graphene_optical_dataset").
      key: dataset_name
      type: str
    - description: The reference 2D material that the dataset represents (e.g., "graphene").
      key: material
      type: str
    - description: List of data sources or repositories from which images were obtained
        (URLs, lab collection names, etc.).
      key: source_list
      type: List[str]
    - description: Ordered list of actions required to acquire the raw microscopy
        images (e.g., instrument settings, capture protocol).
      key: acquisition_steps
      type: List[str]
    - description: Steps to check image quality, correctness of labels, and consistency
        (e.g., visual inspection, checksum validation).
      key: verification_steps
      type: List[str]
    - description: Required annotation fields for each image, such as "layer_count",
        "flake_id", or "defect_label".
      key: annotation_requirements
      type: List[str]
    - description: Chosen storage format for the labeled dataset (e.g., "TFRecord",
        "HDF5", "directory with CSV metadata").
      key: storage_format
      type: str
    - description: Filesystem path or cloud bucket location where the finalized dataset
        is stored.
      key: dataset_path
      type: str
    - description: Total number of labeled images collected in the dataset.
      key: total_samples
      type: int
    - description: Flag indicating whether the dataset has passed verification and
        is ready to be used for backbone pre‑training.
      key: is_ready_for_pretraining
      type: bool
    prd:
      bullets:
      - complexity: LOW
        impact: HIGH
        method: Create a constant string variable; embed the material name; store
          in the output field `dataset_name`.
        reason: A clear identifier ensures downstream nodes can reference the dataset
          unambiguously and avoids naming collisions.
        text: Define the reference material (e.g., graphene) and assign a concise
          dataset identifier such as "graphene_optical_dataset".
      - complexity: MEDIUM
        impact: HIGH
        method: Search repositories (e.g., Materials Cloud, NanoHUB, university data
          portals), query literature for supplementary datasets, and record URLs or
          lab inventory IDs in `source_list`.
        reason: Using multiple sources maximizes dataset diversity, improves model
          generalisation, and satisfies reproducibility requirements.
        text: Compile a comprehensive list of publicly available and in‑house sources
          that contain high‑resolution optical‑microscopy images of the reference
          material.
      - complexity: MEDIUM
        impact: MEDIUM
        method: 'Create a step‑by‑step bullet list per source and concatenate them
          into the `acquisition_steps` array; use a templated format: "[Source] –
          Set XYZ, capture 2048×2048 PNG at 100× magnification".'
        reason: Explicit acquisition metadata enables reproducible reconstruction
          of raw image conditions and supports later quality‑control steps.
        text: 'For each source, document the acquisition protocol: microscope type,
          objective magnification, illumination wavelength, exposure time, pixel resolution,
          and any preprocessing performed by the source.'
      - complexity: LOW
        impact: MEDIUM
        method: Write a shell script (or Python `requests`/`gdown`) that iterates
          over `source_list`, saves files to `<staging_dir>/<source_name>/`, and logs
          MD5 hashes.
        reason: Maintaining original structure prevents loss of provenance and facilitates
          checksum verification.
        text: Download or request the raw image files, preserving original filenames
          and metadata (EXIF, TIFF tags). Store them in a temporary staging directory
          organized by source.
      - complexity: LOW
        impact: HIGH
        method: Create a JSON schema file and list its field names in the output list.
        reason: A standardized annotation format ensures consistency across sources
          and downstream training pipelines.
        text: 'Define the annotation schema required for each image: at minimum `layer_count`
          (integer), optional `flake_id` (string), and optional `defect_label` (enumerated).
          Record this schema in `annotation_requirements`.'
      - complexity: HIGH
        impact: HIGH
        method: Assign a trained annotator, generate a CSV `annotations.csv` with
          columns `filename,layer_count,flake_id,defect_label`; store alongside images.
        reason: Accurate labeling is crucial for supervised pre‑training; semi‑automated
          methods speed up the process while preserving quality.
        text: Perform manual or semi‑automated annotation of each image according
          to the schema. Use tools such as LabelImg, CVAT, or custom Python scripts
          that overlay layer‑count tables from source papers.
      - complexity: MEDIUM
        impact: HIGH
        method: Implement a Python validation script that reads the staging directory,
          checks MD5 against recorded values, cross‑references the CSV, and logs any
          inconsistencies; failures raise exceptions.
        reason: Verification guarantees dataset integrity, prevents garbage‑in‑garbage‑out
          during model training, and satisfies reproducibility audits.
        text: 'Execute verification steps: (a) compute and record checksums for each
          image, (b) run a visual inspection checklist (focus, illumination uniformity,
          artefacts), (c) validate that every image has a matching annotation entry,
          (d) ensure `layer_count` values are within expected physical limits (1‑10
          layers for graphene). Append each step description to `verification_steps`.'
      - complexity: MEDIUM
        impact: MEDIUM
        method: Write a conversion script that reads images and annotations, writes
          them into TFRecord files (one file per 1,000 samples) and concurrently writes
          a `manifest.csv`; set `storage_format` accordingly.
        reason: Optimised storage reduces I/O bottlenecks, enables sharding, and ensures
          compatibility with downstream training code.
        text: 'Select a storage format that is both efficient for large‑scale training
          and easy to stream: choose TFRecord for TensorFlow pipelines or HDF5 for
          PyTorch, and also keep a human‑readable CSV manifest.'
      - complexity: LOW
        impact: HIGH
        method: Copy TFRecord shards and manifest CSV to the chosen bucket using `gsutil`
          or `rsync`; verify copy via checksum.
        reason: A fixed, versioned location enables downstream nodes to reliably locate
          the dataset without ambiguity.
        text: 'Persist the finalized dataset to a permanent location: e.g., `gs://my‑project-data/datasets/graphene_optical_dataset/`
          or `/mnt/data/datasets/graphene_optical_dataset/`. Record the absolute URI
          in `dataset_path`.'
      - complexity: LOW
        impact: MEDIUM
        method: Run `len(annotations.csv)`; set boolean based on exit status of verification
          script.
        reason: Providing explicit counts and a ready flag allows downstream training
          nodes to make conditional decisions (e.g., abort if dataset incomplete).
        text: Calculate `total_samples` by counting the number of image‑annotation
          pairs stored; set `is_ready_for_pretraining` to `true` only if all verification
          steps passed without errors.
    prompt: Provide a step‑by‑step plan to acquire, verify, and store a labeled dataset
      of optical microscopy images for a chosen reference material (e.g., graphene).
      List sources, required annotations (layer count), and storage format.
  compute_accuracy_and_forgetting_metrics:
    agent: false
    description: Aggregate performance numbers for CLIFF, naive fine‑tuning, and prompt‑only
      baselines, computing both accuracy and forgetting.
    name: compute_accuracy_and_forgetting_metrics
    nodes_depended_on:
    - evaluate_cliff_performance
    - train_naive_fine_tuning_baseline
    - train_prompt_based_baseline
    - split_datasets
    nodes_dependent_on: []
    output_structure:
    - description: List of model identifiers included in the evaluation (e.g., ['CLIFF',
        'NaiveFineTuning', 'PromptBaseline']).
      key: models
      type: List[str]
    - description: List of material names for which accuracy is reported, in the same
        order as the per‑material accuracy lists.
      key: materials
      type: List[str]
    - description: Top‑1 accuracy of the CLIFF model on each material's test set,
        ordered according to the 'materials' list.
      key: cliff_per_material_accuracy
      type: List[float]
    - description: Top‑1 accuracy of the naive fine‑tuning baseline on each material's
        test set, ordered according to the 'materials' list.
      key: naive_fine_tuning_per_material_accuracy
      type: List[float]
    - description: Top‑1 accuracy of the prompt‑only baseline on each material's test
        set, ordered according to the 'materials' list.
      key: prompt_baseline_per_material_accuracy
      type: List[float]
    - description: Mean accuracy of the CLIFF model across all materials.
      key: cliff_mean_accuracy
      type: float
    - description: Mean accuracy of the naive fine‑tuning baseline across all materials.
      key: naive_fine_tuning_mean_accuracy
      type: float
    - description: Mean accuracy of the prompt‑only baseline across all materials.
      key: prompt_baseline_mean_accuracy
      type: float
    - description: 'Forgetting metric for CLIFF: average drop in accuracy on previously
        learned materials after learning later ones.'
      key: cliff_forgetting
      type: float
    - description: Forgetting metric for the naive fine‑tuning baseline.
      key: naive_fine_tuning_forgetting
      type: float
    - description: Forgetting metric for the prompt‑only baseline.
      key: prompt_baseline_forgetting
      type: float
    - description: A JSON‑formatted string containing all of the above fields, suitable
        for downstream consumption.
      key: summary_json
      type: str
    prd:
      bullets:
      - complexity: LOW
        impact: HIGH
        method: 'Use a Python dict: `RESULT_PATHS = {''CLIFF'': ''results/CLIFF/test_metrics.json'',
          ''NaiveFineTuning'': ''results/NaiveFineTuning/test_metrics.json'', ''PromptBaseline'':
          ''results/PromptBaseline/test_metrics.json''}`. Validate existence with
          `os.path.exists` and raise a clear error if missing.'
        reason: A uniform naming scheme eliminates ambiguity when loading data from
          disparate training pipelines and enables reproducible aggregation.
        text: Define a deterministic file‑naming convention for each model’s test‑result
          artefact (e.g., `results/<model_id>/test_metrics.json`) and store the path
          in a constant dictionary for lookup.
      - complexity: MEDIUM
        impact: HIGH
        method: Implement a helper `load_metrics(path)` that returns `(ordered_materials,
          acc_dict)`. Use `json.load` and assert that all expected materials from
          `split_datasets.material_names` are present.
        reason: Both the per‑material accuracy and the order of learning are required
          to compute forgetting correctly.
        text: Load per‑material test accuracies from each JSON file; each file must
          contain a mapping `material_name -> top1_accuracy` and a list `ordered_materials`
          that reflects the chronological learning order.
      - complexity: LOW
        impact: MEDIUM
        method: 'Iterate over the canonical material list and build ordered accuracy
          lists: `cliff_acc = [cliff_dict[m] for m in canonical]` etc. Log a warning
          if any model is missing a material and insert `None` (later handled as `nan`).'
        reason: Consistent ordering guarantees that per‑material lists line up when
          constructing the final output structure.
        text: Validate that the material order is identical across all three models;
          if not, re‑order each model’s accuracy list to match the canonical order
          from `split_datasets.material_names`.
      - complexity: LOW
        impact: HIGH
        method: Use `np.nanmean(np.array(acc_list, dtype=float))` from NumPy for robust
          handling of missing values.
        reason: Mean accuracy is a primary evaluation metric required by downstream
          nodes.
        text: Compute mean accuracy for each model by averaging over the ordered per‑material
          accuracies, ignoring `nan` entries.
      - complexity: MEDIUM
        impact: HIGH
        method: Assume each model’s JSON contains a list `cumulative_accuracies` where
          entry *k* is the accuracy on material *k* after training up to material
          *k*. Compute `drops = [cum_acc[i] - final_acc[i] for i in range(num_materials-1)]`
          and take the mean. If `cumulative_accuracies` is absent, fallback to the
          simple definition `mean(initial_accuracy - final_accuracy)`.
        reason: Forgetting measures catastrophic loss of knowledge; the definition
          matches that of `evaluate_cliff_performance` and ensures comparability across
          baselines.
        text: 'Implement the forgetting calculation: for a given model, iterate over
          the learning sequence; for each material *i* compute the drop `acc_i_before
          - acc_i_after` where `acc_i_before` is the accuracy recorded immediately
          after material *i* was first learned, and `acc_i_after` is the accuracy
          after the final material has been learned. Average these drops across all
          *i* to obtain the forgetting metric.'
      - complexity: LOW
        impact: HIGH
        method: "```python\noutput = {\n    \"models\": [\"CLIFF\", \"NaiveFineTuning\"\
          , \"PromptBaseline\"],\n    \"materials\": canonical,\n    \"cliff_per_material_accuracy\"\
          : cliff_acc,\n    \"naive_fine_tuning_per_material_accuracy\": naive_acc,\n\
          \    \"prompt_baseline_per_material_accuracy\": prompt_acc,\n    \"cliff_mean_accuracy\"\
          : cliff_mean,\n    \"naive_fine_tuning_mean_accuracy\": naive_mean,\n  \
          \  \"prompt_baseline_mean_accuracy\": prompt_mean,\n    \"cliff_forgetting\"\
          : cliff_forget,\n    \"naive_fine_tuning_forgetting\": naive_forget,\n \
          \   \"prompt_baseline_forgetting\": prompt_forget,\n    \"summary_json\"\
          : json.dumps(...)\n}\n```"
        reason: Downstream nodes expect a single JSON‑formatted string; sorting keys
          improves readability and deterministic output for testing.
        text: Assemble the final output dictionary with keys matching the declared
          `output_structure` (models, materials, per‑material lists, means, forgettings).
          Convert the entire dict to a JSON string with `json.dumps(..., indent=2,
          sort_keys=True)` and store under `summary_json`.
      - complexity: LOW
        impact: MEDIUM
        method: Create a small utility module `utils.py` with `load_json(path)` and
          `assert_materials_match(list1, list2)` functions. Use Python's `logging`
          module at INFO level for normal operation and ERROR level for failures.
        reason: Early failure detection simplifies debugging of upstream pipelines
          and prevents silent propagation of incorrect metrics.
        text: 'Add robust error handling: wrap each I/O operation in try/except blocks,
          log missing files, malformed JSON, or mismatched material sets, and raise
          a custom `MetricsAggregationError` with a clear message.'
      - complexity: MEDIUM
        impact: MEDIUM
        method: Use `pytest` with fixtures that generate temporary result JSON files.
          Validate that `compute_accuracy_and_forgetting_metrics()` returns a dict
          whose fields match the `output_structure` types.
        reason: Automated testing guarantees that future changes to parent nodes or
          data formats do not break this aggregation step.
        text: 'Write unit tests covering: (a) correct loading and ordering, (b) mean
          calculation with NaNs, (c) forgetting computation on a synthetic cumulative‑accuracy
          series, and (d) JSON output schema compliance.'
      - complexity: LOW
        impact: LOW
        method: Follow Google Python style guide for docstrings.
        reason: Clear documentation aids downstream developers and ensures the function
          can be called programmatically without re‑reading the prompt.
        text: Document the function in a docstring that mirrors the node’s prompt,
          includes parameter descriptions (`result_paths`), return type (`dict`),
          and an example of the produced `summary_json`.
    prompt: Write a Python‑style function that loads each model's test results, calculates
      per‑material accuracy, mean accuracy, and forgetting (accuracy loss on earlier
      materials). Output a JSON summary.
  configure_training_hyperparameters:
    agent: false
    description: Set learning rates, batch sizes, optimizer types, and schedule for
      both base pre‑training and incremental material training.
    name: configure_training_hyperparameters
    nodes_depended_on:
    - design_backbone_and_base_head
    - implement_prompt_pool_structure
    - implement_delta_head
    nodes_dependent_on: []
    output_structure:
    - description: Optimizer used for the initial pre‑training phase (e.g., "AdamW").
      key: base_optimizer
      type: str
    - description: Learning rate for the backbone and base head during pre‑training.
      key: base_learning_rate
      type: float
    - description: Batch size used for the pre‑training dataset.
      key: base_batch_size
      type: int
    - description: Number of training epochs for the base pre‑training phase.
      key: base_epochs
      type: int
    - description: Learning rate for updating material‑specific prompt vectors during
        incremental training.
      key: incremental_prompt_learning_rate
      type: float
    - description: Learning rate for updating the delta head during incremental training.
      key: incremental_delta_learning_rate
      type: float
    - description: Batch size used for each incremental material training session.
      key: incremental_batch_size
      type: int
    - description: Number of epochs for each incremental material training phase.
      key: incremental_epochs
      type: int
    - description: Ratio of replay (memory) samples to new material samples (e.g.,
        "1:3").
      key: replay_ratio
      type: str
    - description: Brief explanation of why each hyper‑parameter choice was made.
      key: rationale
      type: str
    prd:
      bullets:
      - complexity: MEDIUM
        impact: HIGH
        method: 'Parse the JSON output of the parent node, compute total parameter
          count, and apply a rule‑based scaling: base_lr = 1e‑4 * (100M / total_params).'
        reason: Backbone size directly affects stable training regimes; larger models
          typically need smaller LR to avoid divergence.
        text: Extract dimensionality and parameter count from `design_backbone_and_base_head`
          (backbone_layers, base_head_input_dimension, base_head_output_dimension)
          to guide optimizer and learning‑rate scaling decisions.
      - complexity: LOW
        impact: MEDIUM
        method: Hard‑code optimizer name "AdamW" and expose weight_decay (e.g., 0.01)
          as a constant that can be overridden via config.
        reason: AdamW provides robust convergence on mixed‑precision training and
          is widely used in CL literature.
        text: Select AdamW as `base_optimizer` because it decouples weight decay from
          the gradient update, which is beneficial for transformer‑style prompt vectors
          and ResNet backbones.
      - complexity: LOW
        impact: HIGH
        method: Assign static values; annotate that they can be tuned via a hyper‑parameter
          sweep if GPU resources allow.
        reason: These values balance convergence speed and generalization; batch size
          64 fits typical GPU memory for 224×224 images.
        text: Set `base_learning_rate` to 1e‑4, `base_batch_size` to 64, and `base_epochs`
          to 30 based on empirical studies for ResNet‑50 on optical‑microscopy datasets.
      - complexity: MEDIUM
        impact: HIGH
        method: 'Compute: incremental_prompt_lr = base_lr * 0.5; incremental_delta_lr
          = base_lr * 0.3; round to 5e‑5 and 3e‑5.'
        reason: Prompts are lightweight and benefit from a slightly higher LR than
          the delta head, which is deeper and more prone to over‑fitting.
        text: Derive incremental learning rates (`incremental_prompt_learning_rate`
          and `incremental_delta_learning_rate`) from the base LR using a decay factor
          of 0.5 for prompts and 0.3 for delta head (e.g., 5e‑5 and 3e‑5 respectively).
      - complexity: LOW
        impact: MEDIUM
        method: Set constants; document that batch size can be scaled with GPU memory
          availability.
        reason: Smaller batches reduce memory pressure when mixing replay samples;
          fewer epochs avoid catastrophic forgetting while still allowing prompt/delta
          adaptation.
        text: Choose `incremental_batch_size` = 32 and `incremental_epochs` = 15 for
          each new material, reflecting the smaller data volume per material and the
          need for faster convergence during continual learning.
      - complexity: LOW
        impact: HIGH
        method: Hard‑code string "1:3"; expose as a tunable parameter in the configuration
          file.
        reason: Empirical CL studies show a 1:3 ratio mitigates forgetting without
          overwhelming the optimizer with old data.
        text: Define `replay_ratio` as "1:3" (one replay sample per three new material
          samples) to maintain a balanced proportion of historic knowledge while focusing
          on new data.
      - complexity: LOW
        impact: MEDIUM
        method: 'Template‑based string generation: concatenate explanations from previous
          bullets into a single paragraph.'
        reason: Providing rationale improves reproducibility and aids future hyper‑parameter
          tuning.
        text: Compose a concise `rationale` field that succinctly explains each hyper‑parameter
          choice, linking back to model size, dataset characteristics, and continual‑learning
          theory.
      - complexity: MEDIUM
        impact: HIGH
        method: Implement a schema validator (e.g., using jsonschema) that checks
          type and presence of each key before returning the final output.
        reason: Downstream nodes expect strict type adherence; early validation prevents
          runtime errors.
        text: Validate that all output fields conform to the declared PrimitiveTypes
          and serialize them into a JSON object for downstream nodes.
    prompt: List concrete hyper‑parameters (e.g., AdamW lr=1e‑4, batch=64, epochs=30
      for base; lr=5e‑5 for prompts/delta, replay ratio 1:3). Explain rationale.
  define_knowledge_distillation_loss:
    agent: false
    description: Formulate a loss that distills knowledge from the frozen base model
      into the evolving CLIFF model using replay samples.
    name: define_knowledge_distillation_loss
    nodes_depended_on:
    - set_up_memory_replay_buffer
    nodes_dependent_on: []
    output_structure:
    - description: Mathematical expression of the combined loss function.
      key: loss_expression
      type: str
    - description: Type of classification loss used (e.g., cross-entropy).
      key: classification_loss_type
      type: str
    - description: Type of distillation loss used (e.g., KL-divergence).
      key: distillation_loss_type
      type: str
    - description: Name of the weighting hyperparameter used in the loss function.
      key: weighting_hyperparameter_name
      type: str
    - description: Proposed value of the weighting hyperparameter.
      key: weighting_hyperparameter_value
      type: float
    prd:
      bullets:
      - complexity: MEDIUM
        impact: HIGH
        method: Use a lightweight JSON/YAML parser to read a manifest file located
          in `buffer_directory` that maps each exemplar path to its stored logits;
          then stack logits into a PyTorch tensor on the same device as the training
          model.
        reason: The distillation term requires the frozen base model's logits for
          the exact replay samples; loading them once at the start avoids repeated
          forward passes through the frozen model.
        text: Load replay buffer metadata from the parent node `set_up_memory_replay_buffer`
          (buffer_directory, exemplar_file_paths, class_ids) and deserialize the stored
          base logits for each exemplar into a tensor `Z_base` of shape [N_replay,
          C] where C is the number of classes.
      - complexity: LOW
        impact: HIGH
        method: Implement `torch.nn.CrossEntropyLoss(reduction='mean')` and expose
          its string name as `classification_loss_type = "cross_entropy"`.
        reason: Cross‑entropy is the de‑facto loss for multi‑class classification
          and aligns with the evaluation metric (top‑1 accuracy).
        text: Define the classification loss function `L_{cls}` as standard categorical
          cross‑entropy (CE) between the current model logits `Z_curr` for the *new*
          material batch and the one‑hot ground‑truth labels `y`.
      - complexity: MEDIUM
        impact: HIGH
        method: 'Apply temperature `T` (commonly T=2) to both logits: `p = softmax(Z_curr^{replay}
          / T)`, `q = softmax(Z_base / T)`. Compute `L_{kd} = KLDivLoss(log(p), q)
          * (T^2)` to correct gradient scaling.'
        reason: KL‑divergence measures how well the student (current CLIFF model)
          mimics the teacher (frozen base) on replayed exemplars, encouraging retention
          of previously learned knowledge.
        text: Define the distillation loss function `L_{kd}` as the Kullback‑Leibler
          divergence between the current model logits `Z_curr^{replay}` (softmax temperature‑scaled)
          and the stored base logits `Z_base` (also temperature‑scaled). Use PyTorch's
          `KLDivLoss` with `log_target=False` and `reduction='batchmean'`.
      - complexity: LOW
        impact: MEDIUM
        method: Set `weighting_hyperparameter_name = "distillation_weight"` and propose
          a default `weighting_hyperparameter_value = 0.5`. Document that this value
          can be overridden via the training‑hyperparameter config.
        reason: A scalar weight lets practitioners tune the trade‑off between learning
          new material and preserving old knowledge; typical values lie in [0.1, 1.0].
        text: 'Introduce a weighting hyper‑parameter `λ_{kd}` (named `distillation_weight`)
          to balance the two objectives: `L = L_{cls} + λ_{kd} * L_{kd}`.'
      - complexity: LOW
        impact: HIGH
        method: String‑format the expression using the variable names defined above;
          embed LaTeX delimiters for readability.
        reason: Providing a clear mathematical formula is required by downstream documentation
          and ensures reproducibility across implementations.
        text: 'Compose the final loss expression string `loss_expression` in LaTeX‑compatible
          notation, e.g.:


          ```

          L = \underbrace{\text{CE}(Z_{curr}^{new}, y)}_{\text{classification}} +
          \lambda_{kd}\,\underbrace{\text{KL}\big(\text{softmax}(Z_{curr}^{replay}/T)
          \| \text{softmax}(Z_{base}/T)\big)}_{\text{distillation}}

          ```'
      - complexity: LOW
        impact: MEDIUM
        method: Insert a runtime check `assert Z_curr_replay.shape == Z_base.shape`
          with an informative error message.
        reason: Mismatched dimensions would cause runtime errors during loss computation
          and break the training loop.
        text: 'Validate shape compatibility: assert that `Z_curr^{replay}` and `Z_base`
          share the same class dimension `C`, and that the batch size of replay samples
          matches the number of stored logits.'
      - complexity: LOW
        impact: HIGH
        method: Populate a Python dict with the keys and cast values to `str` or `float`
          as required; serialize to JSON if needed.
        reason: Downstream nodes (`incremental_train_material_specific_components`)
          consume these fields to construct the actual training step; strict type
          adherence avoids serialization issues.
        text: Export the five required output fields (`loss_expression`, `classification_loss_type`,
          `distillation_loss_type`, `weighting_hyperparameter_name`, `weighting_hyperparameter_value`)
          as plain strings/floats according to the node's output schema.
    prompt: 'Write the mathematical expression for a combined loss: classification
      cross‑entropy on current material + KL‑divergence between current logits and
      stored base logits for replay samples. Include weighting hyper‑parameter.'
