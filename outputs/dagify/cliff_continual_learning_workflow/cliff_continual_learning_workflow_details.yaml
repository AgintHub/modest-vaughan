    prd:
      bullets:
      - complexity: LOW
        impact: HIGH
        method: Iterate over `model.backbone.parameters()` and `model.base_head.parameters()`;
          raise an error if any `requires_grad` is True.
        reason: Ensures no accidental gradient updates leak into the frozen components
          during incremental training.
        text: Validate that the backbone and base head are frozen by checking `requires_grad=False`
          for all their parameters (output from `freeze_backbone_and_base_head`).
      - complexity: LOW
        impact: HIGH
        method: Parse the JSON or Python dict returned by the parent node; instantiate
          AdamW for prompts and delta head with `incremental_prompt_learning_rate`
          and `incremental_delta_learning_rate` respectively.
        reason: All subsequent training loops must obey the same schedule and optimizer
          settings to guarantee reproducibility.
        text: Load the hyper‑parameter configuration generated by `configure_training_hyperparameters`
          (learning rates, batch size, replay ratio, epochs, optimizer types).
      - complexity: MEDIUM
        impact: HIGH
        method: Create a `torch.nn.Embedding(num_materials, prompt_dim)` with `requires_grad=True`;
          map material IDs to embedding indices.
        reason: Material‑specific prompts must exist before training begins; they
          provide the conditioning signal for the gated features.
        text: Initialize the prompt pool for all new materials using the schema from
          `implement_prompt_pool_structure` (prompt dimension, number of materials).
