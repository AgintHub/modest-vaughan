dag_type: plain_text
description: A fully detailed, highly concurrent workflow that builds, trains, and
  evaluates the CLIFF continual‑learning framework for 2D material flake layer classification,
  including data preparation, model architecture, material‑specific prompt learning,
  memory replay, knowledge distillation, baseline comparisons, and result reporting.
name: cliff_continual_learning_workflow
nodes:
  collect_new_material_datasets:
    agent: false
    description: Gather labeled optical‑microscopy datasets for each additional 2D
      material that will be introduced sequentially.
    name: collect_new_material_datasets
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Outline how to collect, annotate, and store separate labeled image sets
      for at least three new 2D materials (e.g., MoS2, WS2, h‑BN). Include data‑split
      recommendations.
  collect_reference_material_dataset:
    agent: false
    description: Gather a labeled optical‑microscopy dataset for the reference 2D
      material that will be used to pre‑train the backbone and base head.
    name: collect_reference_material_dataset
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Provide a step‑by‑step plan to acquire, verify, and store a labeled dataset
      of optical microscopy images for a chosen reference material (e.g., graphene).
      List sources, required annotations (layer count), and storage format.
  compute_accuracy_and_forgetting_metrics:
    agent: false
    description: Aggregate performance numbers for CLIFF, naive fine‑tuning, and prompt‑only
      baselines, computing both accuracy and forgetting.
    name: compute_accuracy_and_forgetting_metrics
    nodes_depended_on:
    - evaluate_cliff_performance
    - train_naive_fine_tuning_baseline
    - train_prompt_based_baseline
    - split_datasets
    nodes_dependent_on: []
    prompt: Write a Python‑style function that loads each model's test results, calculates
      per‑material accuracy, mean accuracy, and forgetting (accuracy loss on earlier
      materials). Output a JSON summary.
  configure_training_hyperparameters:
    agent: false
    description: Set learning rates, batch sizes, optimizer types, and schedule for
      both base pre‑training and incremental material training.
    name: configure_training_hyperparameters
    nodes_depended_on:
    - design_backbone_and_base_head
    - implement_prompt_pool_structure
    - implement_delta_head
    nodes_dependent_on: []
    prompt: List concrete hyper‑parameters (e.g., AdamW lr=1e‑4, batch=64, epochs=30
      for base; lr=5e‑5 for prompts/delta, replay ratio 1:3). Explain rationale.
  define_knowledge_distillation_loss:
    agent: false
    description: Formulate a loss that distills knowledge from the frozen base model
      into the evolving CLIFF model using replay samples.
    name: define_knowledge_distillation_loss
    nodes_depended_on:
    - set_up_memory_replay_buffer
    nodes_dependent_on: []
    prompt: 'Write the mathematical expression for a combined loss: classification
      cross‑entropy on current material + KL‑divergence between current logits and
      stored base logits for replay samples. Include weighting hyper‑parameter.'
  define_project_scope:
    agent: false
    description: State the precise research goals, performance metrics, and constraints
      for the CLIFF framework.
    name: define_project_scope
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Write a concise project scope for a continual‑learning system that classifies
      flake layers from optical microscopy images. Include primary objective, evaluation
      metrics (e.g., accuracy, forgetting), and high‑level constraints (e.g., frozen
      backbone).
  design_backbone_and_base_head:
    agent: false
    description: Specify the CNN backbone architecture and the classification head
      that will be initially trained on the reference material.
    name: design_backbone_and_base_head
    nodes_depended_on:
    - define_project_scope
    nodes_dependent_on: []
    prompt: Propose a concrete backbone (e.g., ResNet‑50) and a base classification
      head (fully‑connected layer) suitable for flake‑layer classification. Include
      layer dimensions and initialization strategy.
  evaluate_cliff_performance:
    agent: false
    description: Run inference on test splits of all materials and record per‑material
      accuracy and overall forgetting metric.
    name: evaluate_cliff_performance
    nodes_depended_on:
    - incremental_train_material_specific_components
    - split_datasets
    nodes_dependent_on: []
    prompt: 'Describe how to evaluate the trained CLIFF model: compute top‑1 accuracy
      for each material''s test set, compute average accuracy across materials, and
      calculate forgetting as the drop in accuracy on earlier materials after learning
      later ones.'
  freeze_backbone_and_base_head:
    agent: false
    description: Mark backbone and base head parameters as non‑trainable for subsequent
      continual learning phases.
    name: freeze_backbone_and_base_head
    nodes_depended_on:
    - train_base_model_on_reference
    nodes_dependent_on: []
    prompt: Explain how to set requires_grad=False for backbone and base head tensors
      in the chosen deep‑learning framework, and verify that only prompts and delta
      head are trainable.
  generate_comparative_results_table:
    agent: false
    description: Create a markdown table comparing CLIFF, naive fine‑tuning, and prompt‑only
      baselines across all metrics.
    name: generate_comparative_results_table
    nodes_depended_on:
    - compute_accuracy_and_forgetting_metrics
    nodes_dependent_on: []
    prompt: Produce a markdown table with rows for each model and columns for overall
      accuracy, average forgetting, and per‑material accuracies (list up to three
      materials).
  implement_cosine_similarity_gate:
    agent: false
    description: Build a gate that selects and weights prompts based on cosine similarity
      between input features and prompt embeddings.
    name: implement_cosine_similarity_gate
    nodes_depended_on:
    - implement_prompt_pool_structure
    nodes_dependent_on: []
    prompt: Write pseudo‑code for a cosine‑similarity gate that computes similarity
      scores between the backbone output and each prompt embedding, applies softmax,
      and produces a weighted prompt aggregation.
  implement_delta_head:
    agent: false
    description: Define a lightweight residual head that learns material‑specific
      corrections on top of the frozen base head.
    name: implement_delta_head
    nodes_depended_on:
    - design_backbone_and_base_head
    nodes_dependent_on: []
    prompt: Specify the architecture of the delta head (e.g., two‑layer MLP) that
      takes gated features as input and outputs corrections to the base head logits.
      Provide layer sizes and activation functions.
  implement_prompt_pool_structure:
    agent: false
    description: Create the data structure and embedding logic for a pool of learnable
      material‑specific prompts.
    name: implement_prompt_pool_structure
    nodes_depended_on:
    - design_backbone_and_base_head
    nodes_dependent_on: []
    prompt: 'Describe how to implement a prompt pool: each prompt is a learnable vector
      of size D, indexed by material ID. Explain integration with the backbone feature
      map (e.g., prepend to token sequence).'
  incremental_train_material_specific_components:
    agent: false
    description: For each new material, jointly train the material‑specific prompt,
      delta head, and replay/distillation mechanisms while keeping backbone frozen.
    name: incremental_train_material_specific_components
    nodes_depended_on:
    - freeze_backbone_and_base_head
    - collect_new_material_datasets
    - implement_cosine_similarity_gate
    - implement_delta_head
    - set_up_memory_replay_buffer
    - define_knowledge_distillation_loss
    - configure_training_hyperparameters
    nodes_dependent_on: []
    prompt: 'Write a step‑by‑step incremental training procedure: load new material
      training split, sample replay exemplars, compute gated features, forward through
      delta head, compute combined loss, back‑propagate only on prompts and delta
      head, update memory buffer, repeat for each material in sequence.'
  preprocess_images:
    agent: false
    description: Standardize all images (normalization, resizing, augmentation) and
      store them ready for training.
    name: preprocess_images
    nodes_depended_on:
    - collect_reference_material_dataset
    - collect_new_material_datasets
    nodes_dependent_on: []
    prompt: Write a script‑style description that loads all collected images, normalizes
      pixel values, resizes to a common resolution, and optionally creates augmentation
      pipelines (rotation, flip, brightness). Describe output directory structure.
  produce_visualizations:
    agent: false
    description: Generate plots (e.g., accuracy vs. material order, forgetting curve)
      to visually illustrate CLIFF’s advantages.
    name: produce_visualizations
    nodes_depended_on:
    - compute_accuracy_and_forgetting_metrics
    nodes_dependent_on: []
    prompt: Describe how to plot (a) accuracy over the sequence of learned materials
      for each method, and (b) forgetting magnitude per material. Include matplotlib
      code snippets and expected figure captions.
  set_up_memory_replay_buffer:
    agent: false
    description: Create a buffer that stores exemplar samples from previously learned
      materials for replay during continual training.
    name: set_up_memory_replay_buffer
    nodes_depended_on:
    - split_datasets
    nodes_dependent_on: []
    prompt: 'Explain how to construct a memory replay buffer: number of exemplars
      per class, sampling strategy, storage format, and retrieval API for training
      loops.'
  split_datasets:
    agent: false
    description: Create train/validation/test splits for the reference and each new
      material while preserving class balance.
    name: split_datasets
    nodes_depended_on:
    - preprocess_images
    nodes_dependent_on: []
    prompt: Detail a reproducible splitting procedure (e.g., stratified 70/15/15)
      for each material’s preprocessed dataset. Output JSON files listing file paths
      for each split.
  train_base_model_on_reference:
    agent: false
    description: Train the backbone and base head on the reference material dataset,
      then freeze them.
    name: train_base_model_on_reference
    nodes_depended_on:
    - split_datasets
    - design_backbone_and_base_head
    - configure_training_hyperparameters
    nodes_dependent_on: []
    prompt: 'Provide a concise training loop description for the base model: load
      reference training split, train for N epochs, monitor validation accuracy, then
      save and freeze weights.'
  train_naive_fine_tuning_baseline:
    agent: false
    description: Fine‑tune the entire backbone and head on each new material sequentially
      without any continual‑learning safeguards, to serve as a baseline.
    name: train_naive_fine_tuning_baseline
    nodes_depended_on:
    - design_backbone_and_base_head
    - split_datasets
    - configure_training_hyperparameters
    nodes_dependent_on: []
    prompt: Provide a training script outline that, for each new material, unfreezes
      all parameters, trains on the material's data, and proceeds to the next material
      without replay or prompts.
  train_prompt_based_baseline:
    agent: false
    description: Train only material prompts (no delta head, no replay) on each new
      material to serve as a prompt‑only baseline.
    name: train_prompt_based_baseline
    nodes_depended_on:
    - design_backbone_and_base_head
    - implement_prompt_pool_structure
    - split_datasets
    - configure_training_hyperparameters
    nodes_dependent_on: []
    prompt: Sketch a training loop where only the prompt vectors are updated for each
      new material while the backbone stays frozen and no delta head or replay is
      used.
  write_summary_report:
    agent: false
    description: Compose a concise report summarizing methodology, experiments, results,
      and key conclusions about CLIFF.
    name: write_summary_report
    nodes_depended_on:
    - generate_comparative_results_table
    - produce_visualizations
    nodes_dependent_on: []
    prompt: Draft a structured report (Abstract, Introduction, Method, Experiments,
      Results, Discussion, Conclusion) that integrates the generated tables, figures,
      and quantitative findings about CLIFF versus baselines.
