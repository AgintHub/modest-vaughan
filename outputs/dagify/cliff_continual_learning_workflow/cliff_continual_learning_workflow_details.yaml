      - complexity: MEDIUM
        impact: HIGH
        method: Compute `num_new = batch_size * (replay_ratio_denominator/(replay_ratio_numerator+replay_ratio_denominator))`;
          sample `num_replay = batch_size - num_new` from the buffer each iteration.
        reason: Balancing new and old data mitigates catastrophic forgetting while
          respecting the configured replay schedule.
        text: Create a `DataLoader` that mixes new‑material samples with replay exemplars
          according to the `replay_ratio` (e.g., "1:3" → 1 replay sample for every
          3 new samples). Shuffle within each epoch.
      - complexity: HIGH
        impact: HIGH
        method: Implement a `forward()` method in a wrapper module that calls `self.backbone(image)`,
          `self.cosine_gate(F)`, merges prompts, and then `self.delta_head(G)`. Cache
          base head output with `torch.no_grad()`.
        reason: This sequence implements the core forward computation defined by the
          model architecture, ensuring that only prompts and delta head affect the
          output.
        text: "During each batch forward pass:\n   a. Pass images through the frozen\
          \ backbone to obtain feature vectors `F`.\n   b. Retrieve the current material's\
          \ prompt embedding `P` from the prompt pool.\n   c. Compute cosine‑similarity\
          \ scores between `F` and all prompt embeddings using the gate from `implement_cosine_similarity_gate`.\n\
          \   d. Apply softmax to obtain weights and compute the weighted prompt vector\
          \ `P_weighted`.\n   e. Concatenate or add `P_weighted` to `F` to produce\
          \ gated features `G`.\n   f. Feed `G` into the delta head to obtain correction\
          \ logits `Δlogits`.\n   g. Add `Δlogits` to the frozen base head logits\
          \ (computed once from `F` and cached) to get final logits `logits`."
      - complexity: MEDIUM
        impact: HIGH
        method: Use `torch.nn.CrossEntropyLoss` for classification; for distillation,
          retrieve stored base logits from the replay buffer (saved during earlier
          phases) and compute `torch.nn.KLDivLoss(reduction='batchmean')` with `log_softmax`/`softmax`
