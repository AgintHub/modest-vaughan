          performance.
        text: 'Implement a stratified sampling strategy per class: for each `class_id`
          within each material, select `exemplars_per_class` images using the "herding"
          algorithm (choose samples whose feature embeddings are closest to the class
          centroid) if pre‑computed features exist, otherwise fall back to random
          uniform sampling with a fixed random seed for reproducibility.'
      - complexity: LOW
        impact: MEDIUM
        method: Use `os.makedirs` with `exist_ok=True`; copy with `shutil.copy2` or
          create hard links via `os.link` to avoid duplicating data.
        reason: A hierarchical directory layout mirrors the logical organization (material
          → class) and simplifies path‑based retrieval without requiring a database.
        text: Create a dedicated buffer directory (`buffer_directory`) on the filesystem,
          e.g., `./replay_buffer/`. Within it, create sub‑folders for each material
          (`graphene/`, `MoS2/`, …) and further sub‑folders for each class ID (`class_0/`,
          `class_1/`, …). Copy or hard‑link the selected exemplar image files into
          the appropriate sub‑folder.
      - complexity: LOW
        impact: MEDIUM
        method: Walk the buffer directory with `os.walk`, filter by image extensions,
          sort paths lexicographically, and append to the list.
        reason: Downstream components (loss definition, training loops) need a flat
          list of paths to load images on‑the‑fly.
        text: Populate the `exemplar_file_paths` list with the absolute (or project‑relative)
          paths of all copied exemplar files, preserving the order `material -> class_id
          -> file` for deterministic indexing.
      - complexity: LOW
        impact: LOW
        method: Collect class IDs while sampling; use `sorted(set(collected_ids))`.
        reason: A canonical ordering prevents mismatches between class‑specific exemplars
          and model outputs during distillation.
        text: Generate the `class_ids` list by enumerating all unique class identifiers
          present in the buffer (e.g., `[0,1,2,3]` for layer counts). Store them in
          ascending order to align with the ordering used in the loss function and
          prompt indexing.
      - complexity: LOW
        impact: HIGH
        method: Simple arithmetic comparison; raise `ValueError` with a descriptive
          message if mismatched.
        reason: Integrity check catches bugs in the sampling or file‑copy stages early,
          avoiding silent downstream errors.
        text: Compute `total_exemplars` as `len(exemplar_file_paths)` and verify that
          `total_exemplars == exemplars_per_class * len(class_ids) * number_of_materials`.
          Raise an exception if the equality does not hold.
      - complexity: MEDIUM
        impact: HIGH
        method: Implement the function in `replay_buffer.py`; use `torch.utils.data.Dataset`
          subclass for lazy loading; support optional filtering by `class_ids` and
          optional shuffling via `torch.utils.data.DataLoader`.
        reason: Encapsulating the loading logic behind a well‑documented function
          keeps training loops clean and enables easy swapping of storage back‑ends
          later.
        text: 'Design a lightweight retrieval API called `get_replay_batch(class_ids:
          Optional[List[int]] = None, batch_size: int = 32, shuffle: bool = True)
          -> Tuple[torch.Tensor, List[int]]`. The function loads images from `exemplar_file_paths`
          (using Pillow or OpenCV), applies the same preprocessing pipeline as training
          data, returns a tensor batch and the corresponding class IDs.'
      - complexity: LOW
        impact: MEDIUM
        method: Create a one‑line docstring and store it in the output field.
        reason: Downstream nodes (e.g., `define_knowledge_distillation_loss` and `incremental_train_material_specific_components`)
          need a human‑readable contract to invoke the buffer correctly.
        text: 'Write a concise `retrieval_api_description` string summarizing the
          function signature, input arguments, return types, and any side‑effects
          (e.g., on‑the‑fly augmentation). Example: `"def get_replay_batch(class_ids:
          List[int] = None, batch_size: int = 32, shuffle: bool = True) -> (Tensor[batch,
          C, H, W], List[int])"`.'
      - complexity: LOW
        impact: MEDIUM
        method: Use `json.dump` with `indent=2`; ensure paths are stored relative
          to the project root for portability.
        reason: Persisting metadata enables other pipeline stages to reload the buffer
          without recomputing it, saving time on repeated experiments.
        text: Serialize a metadata JSON file (`metadata.json`) inside `buffer_directory`
          containing all output fields (`buffer_directory`, `exemplars_per_class`,
          `total_exemplars`, `class_ids`, `exemplar_file_paths`). This file serves
          as a checkpoint for reproducibility and debugging.
    prompt: 'Explain how to construct a memory replay buffer: number of exemplars
      per class, sampling strategy, storage format, and retrieval API for training
      loops.'
  split_datasets:
    agent: false
    description: Create train/validation/test splits for the reference and each new
      material while preserving class balance.
    name: split_datasets
    nodes_depended_on:
    - preprocess_images
    nodes_dependent_on: []
    output_structure:
    - description: List of material identifiers (e.g., "graphene", "MoS2", "WS2",
        "h-BN").
      key: material_names
      type: List[str]
    - description: List of file paths to JSON files that contain the training split
        file‑paths for each material, ordered correspondingly to material_names.
      key: train_split_json_paths
      type: List[str]
    - description: List of file paths to JSON files that contain the validation split
        file‑paths for each material, ordered correspondingly to material_names.
      key: validation_split_json_paths
      type: List[str]
    - description: List of file paths to JSON files that contain the test split file‑paths
        for each material, ordered correspondingly to material_names.
      key: test_split_json_paths
      type: List[str]
    - description: Human‑readable description of the split ratios used (e.g., "70%
        train / 15% validation / 15% test").
      key: split_ratio_description
      type: str
    prd:
      bullets:
      - complexity: LOW
        impact: HIGH
        method: Use `os.listdir` on the root processed images directory; filter out
          non‑folder entries; sort alphabetically for deterministic ordering.
        reason: Ensures the splitting procedure automatically adapts to any number
          of materials without hard‑coding identifiers.
        text: Collect the list of material directories from the `processed_images_dir`
          output of `preprocess_images` and infer `material_names` by parsing directory
          names.
      - complexity: MEDIUM
        impact: HIGH
        method: If a `metadata.csv` exists in the material folder, load with `pandas.read_csv`;
          otherwise, infer label from filename convention using regex; store in a
          DataFrame with columns `["filepath", "label"]`.
        reason: Accurate class labels are required to perform stratified sampling
          that preserves class balance across splits.
        text: For each material, read a manifest CSV (or generate one on‑the‑fly)
          that maps every image file path to its class label (layer count).
      - complexity: LOW
        impact: MEDIUM
        method: Group by `label` and count; compare counts to a threshold; log results
          with Python's `logging` module.
        reason: Stratified splitting fails when a class has too few instances; early
          detection prevents downstream errors.
        text: Validate that each material has at least a minimum number of samples
          per class (e.g., 5) to allow a meaningful 70/15/15 split; raise a warning
          or fallback to a simple random split if the condition is not met.
      - complexity: MEDIUM
        impact: HIGH
        method: 'Set `random_state=42` (or configurable seed). First split: `train_idx,
          holdout_idx = sss.split(filepaths, labels)`. Second split on holdout: `val_idx,
          test_idx = sss2.split(holdout_filepaths, holdout_labels)`.'
        reason: StratifiedShuffleSplit guarantees that each split mirrors the original
          class distribution while the fixed `random_state` ensures reproducibility.
        text: Perform a stratified split for each material using `sklearn.model_selection.StratifiedShuffleSplit`
          with `test_size=0.30` and `train_size=0.70`, then further split the 30%
          into validation and test (15% each) using a second `StratifiedShuffleSplit`
          on the held‑out set.
      - complexity: MEDIUM
        impact: MEDIUM
        method: Use `os.makedirs(..., exist_ok=True)`. For large datasets, prefer
          `os.symlink` to avoid duplication; fallback to `shutil.copy2` if symlinks
          are unsupported.
        reason: Physical separation of splits simplifies downstream data loaders and
          prevents accidental leakage between training and evaluation.
        text: 'Create dedicated output directories for each split: `<split_root>/<material>/train/`,
          `<split_root>/<material>/val/`, `<split_root>/<material>/test/` and copy
          (or symlink) the selected image files into these folders.'
      - complexity: LOW
        impact: HIGH
        method: 'Create a Python dict `{ "paths": [list_of_paths] }` and write with
          `json.dump(..., indent=2)`. Collect the generated JSON filepaths into the
          respective output lists.'
        reason: JSON files are lightweight, language‑agnostic, and can be directly
          consumed by downstream training scripts.
        text: Serialize the absolute file paths of each split into JSON files named
          `<material>_train.json`, `<material>_val.json`, and `<material>_test.json`
          stored under a central `splits/` directory.
      - complexity: LOW
        impact: LOW
        method: Hard‑code the description based on the ratios used; make it configurable
          via a constant at the top of the script.
        reason: Provides downstream nodes with a concise summary for logging and reporting
          purposes.
        text: Generate a human‑readable `split_ratio_description` string (e.g., "70%
          train / 15% validation / 15% test") and attach it to the node output.
      - complexity: MEDIUM
        impact: MEDIUM
        method: Re‑load each JSON, map paths back to labels using the earlier manifest,
          compute histograms with `numpy.bincount`, compare percentages, and use `assert`
          or `logging.warning`.
        reason: Guarantees that the stratification succeeded and that downstream evaluation
          will be fair.
        text: 'Run a post‑split verification: compute class distribution for each
          generated split and assert that the deviation from the original distribution
          is ≤ 2% per class; log any violations as warnings.'
      - complexity: LOW
        impact: HIGH
        method: Assemble a dictionary matching the schema and `return` it from the
          node's execution function.
        reason: Ensures strict compliance with the DAG contract and enables downstream
          nodes to consume the splits without additional parsing.
        text: Return the five output fields (`material_names`, `train_split_json_paths`,
          `validation_split_json_paths`, `test_split_json_paths`, `split_ratio_description`)
          in the order defined by the node schema.
    prompt: Detail a reproducible splitting procedure (e.g., stratified 70/15/15)
      for each material’s preprocessed dataset. Output JSON files listing file paths
      for each split.
  train_base_model_on_reference:
    agent: false
    description: Train the backbone and base head on the reference material dataset,
      then freeze them.
    name: train_base_model_on_reference
    nodes_depended_on:
    - split_datasets
    - design_backbone_and_base_head
    - configure_training_hyperparameters
    nodes_dependent_on: []
    output_structure:
    - description: File path to the saved weights of the trained base model.
      key: base_model_weights_path
      type: str
    - description: Number of epochs the base model was trained for.
      key: base_model_training_epochs
      type: int
    - description: The final validation accuracy achieved by the base model.
      key: base_model_validation_accuracy
      type: float
    - description: Boolean indicating whether the backbone parameters are frozen.
      key: backbone_frozen_status
      type: bool
    - description: Boolean indicating whether the base head parameters are frozen.
      key: base_head_frozen_status
      type: bool
    prd:
      bullets:
      - complexity: LOW
        impact: HIGH
        method: Read the `train_split_json_paths` list; match the index of the reference
          material name in `material_names`; load the JSON array of image paths using
          Python's `json` module.
        reason: Accurate loading of the correct training data is fundamental; the
          split JSON guarantees class‑balanced, reproducible splits.
        text: Parse the split_datasets output to locate the JSON file that lists file‑paths
          for the reference material's training split (identified by the material
          name matching the ‘material’ field of the reference dataset).
      - complexity: LOW
        impact: HIGH
        method: Use the same index as above on `validation_split_json_paths`; load
          file paths into a validation dataset object.
        reason: Validation data is required to decide early‑stopping or to record
          the final validation metric.
        text: Similarly parse split_datasets to obtain the reference material's validation
          split JSON for monitoring validation accuracy each epoch.
      - complexity: MEDIUM
        impact: HIGH
        method: Map `backbone_architecture` to a PyTorch model class (e.g., torchvision.models.resnet50);
          rebuild the head as a `nn.Linear(base_head_input_dimension, base_head_output_dimension)`;
          apply the specified `initialization_strategy` (Xavier for linear layers,
          Kaiming for conv layers) via custom weight‑initialization functions.
        reason: The model must be instantiated exactly as designed to ensure downstream
          components (prompt pool, delta head) align with dimensions.
        text: Extract the backbone and base‑head architectural specifications from
          design_backbone_and_base_head (e.g., `backbone_architecture`, `backbone_layers`,
          `base_head_architecture`, `base_head_input_dimension`, `base_head_output_dimension`,
          `initialization_strategy`).
      - complexity: MEDIUM
        impact: MEDIUM
        method: Subclass `torch.utils.data.Dataset`; inside `__getitem__` load image
          via PIL, resize to target dimensions (from `preprocess_images` output),
          convert to tensor, normalize, and fetch label from accompanying metadata
          CSV.
        reason: Ensuring preprocessing consistency between pre‑training and later
          stages prevents distribution shift.
        text: Create a PyTorch `Dataset` class that reads image files from the training
          split, applies the same preprocessing pipeline used in `preprocess_images`
          (resize, normalize with the stored `normalization_mean` and `normalization_std`),
          and returns (image_tensor, label).
      - complexity: LOW
        impact: MEDIUM
        method: '`torch.utils.data.DataLoader(train_dataset, batch_size=base_batch_size,
          shuffle=True, num_workers=4)`; similarly for validation with `shuffle=False`.'
        reason: Efficient batching and shuffling are required for stable gradient
          updates and reproducible validation scores.
        text: Instantiate DataLoaders for training and validation using the batch
          size `base_batch_size` from configure_training_hyperparameters, with `shuffle=True`
          for training and `shuffle=False` for validation.
      - complexity: LOW
        impact: HIGH
        method: '`optimizer = torch.optim.AdamW(model.parameters(), lr=base_learning_rate,
          weight_decay=1e-4)` if `base_optimizer` == "AdamW"; otherwise map string
          to appropriate torch optimizer class.'
        reason: Hyper‑parameter alignment guarantees that the base model is trained
          under the same regime expected by downstream incremental training.
        text: Configure the optimizer as `base_optimizer` (e.g., AdamW) with learning
          rate `base_learning_rate`; optionally add weight decay as per best practices
          for CNN pre‑training.
      - complexity: MEDIUM
        impact: HIGH
        method: 'Pseudo‑code: `for epoch in range(base_epochs): model.train(); for
          imgs, lbls in train_loader: optimizer.zero_grad(); logits = model(imgs);
          loss = criterion(logits, lbls); loss.backward(); optimizer.step();`'
        reason: The core learning process; must be deterministic and record metrics
          for reproducibility.
        text: 'Implement the training loop for exactly `base_epochs` iterations: for
          each epoch, iterate over the training DataLoader, forward‑pass through backbone
          → base head, compute cross‑entropy loss, back‑propagate, and step the optimizer.'
      - complexity: LOW
        impact: HIGH
        method: Set `model.eval()`, disable grad, compute predictions, compare with
          labels, accumulate correct/total counts; store `val_accuracy` in a dict
          keyed by epoch.
        reason: Monitoring validation accuracy enables reporting `base_model_validation_accuracy`
          and early detection of divergence.
        text: After each epoch, evaluate the model on the validation DataLoader, compute
          top‑1 accuracy, and log `epoch`, `train_loss`, `val_accuracy` to a JSON
          or CSV logger for later inspection.
      - complexity: LOW
        impact: HIGH
        method: Extract the last entry from the validation logger; assign to output
          variable.
        reason: This scalar is part of the node's required output and serves as a
          baseline metric for later continual‑learning phases.
        text: Upon completion of all epochs, record the final validation accuracy
          (the accuracy from the last epoch) as `base_model_validation_accuracy`.
      - complexity: LOW
        impact: HIGH
        method: '`torch.save(model.state_dict(), base_model_weights_path)`; ensure
          the directory exists.'
        reason: Downstream nodes (freeze_backbone_and_base_head, incremental training)
          need to load the exact trained weights.
        text: Save the entire model state dict to a deterministic file path, e.g.,
          `models/base_model_epoch{base_epochs}.pth`; assign this path to `base_model_weights_path`.
      - complexity: LOW
        impact: HIGH
        method: "```python\nfor param in model.backbone.parameters():\n    param.requires_grad\
          \ = False\nfor param in model.base_head.parameters():\n    param.requires_grad\
          \ = False\n```"
        reason: The specification demands a frozen backbone for continual‑learning;
          freezing prevents accidental gradient updates later.
        text: Freeze the backbone and base head by iterating over `model.backbone.parameters()`
          and `model.base_head.parameters()` and setting `param.requires_grad = False`.
      - complexity: LOW
        impact: MEDIUM
        method: Assign `backbone_frozen_status = not any(p.requires_grad for p in
          model.backbone.parameters())` and similarly for `base_head_frozen_status`.
        reason: A verification step ensures correctness before downstream nodes consume
          the frozen model.
        text: Verify freezing by checking that `any(p.requires_grad for p in model.backbone.parameters())`
          and similarly for the base head returns `False`; set `backbone_frozen_status`
          and `base_head_frozen_status` accordingly.
      - complexity: LOW
        impact: HIGH
        method: Create a dict matching `output_structure` and serialize to JSON if
          the workflow engine expects file‑based outputs.
        reason: Conforms to the node's contract; enables downstream nodes to consume
          structured outputs.
        text: Populate the final output dictionary with all required fields (`base_model_weights_path`,
          `base_model_training_epochs`, `base_model_validation_accuracy`, `backbone_frozen_status`,
          `base_head_frozen_status`) and return it from the node execution function.
    prompt: 'Provide a concise training loop description for the base model: load
      reference training split, train for N epochs, monitor validation accuracy, then
      save and freeze weights.'
  train_naive_fine_tuning_baseline:
    agent: false
    description: Fine‑tune the entire backbone and head on each new material sequentially
      without any continual‑learning safeguards, to serve as a baseline.
    name: train_naive_fine_tuning_baseline
    nodes_depended_on:
    - design_backbone_and_base_head
    - split_datasets
    - configure_training_hyperparameters
    nodes_dependent_on: []
    output_structure:
    - description: File paths to the saved model checkpoints after fine‑tuning each
        material in sequence.
      key: trained_checkpoints
      type: List[str]
    - description: Ordered list of material identifiers that were fine‑tuned.
      key: materials_fine_tuned
      type: List[str]
    - description: Indicates whether the fine‑tuning process completed without errors.
      key: training_success
      type: bool
    - description: Number of training epochs used for each material (should match
        the hyper‑parameter setting).
      key: epochs_per_material
      type: List[int]
    - description: Validation accuracy of the final model on the last material's validation
        set.
      key: final_validation_accuracy
      type: float
    prd:
      bullets:
      - complexity: MEDIUM
        impact: HIGH
        method: Parse the JSON output of design_backbone_and_base_head, map layer
          names to PyTorch (or TensorFlow) modules, construct the model class, and
          implement a helper `load_weights(path)` that restores state_dict if a checkpoint
          exists.
        reason: Ensures the training script builds exactly the same network topology
          that downstream nodes expect, preserving reproducibility across experiments.
        text: Instantiate the model architecture using the backbone_architecture,
          backbone_layers, base_head_architecture, base_head_input_dimension, and
          base_head_output_dimension values emitted by the design_backbone_and_base_head
          node; load any pre‑trained weights from the most recent checkpoint (or random
          init if first material).
      - complexity: LOW
        impact: HIGH
        method: Iterate over `model.parameters()` and set `.requires_grad = True`;
          verify with a diagnostic print of the number of trainable parameters.
        reason: The baseline deliberately fine‑tunes the entire network, so every
          weight must be learnable for each incremental step.
        text: Set all model parameters to `requires_grad=True` (unfreeze) before training
          each material, overriding any previous freezing that may have been applied
          during base pre‑training.
      - complexity: LOW
        impact: MEDIUM
        method: 'Load each JSON file (list of image file paths) using `json.load()`.
          Store in a dict `{material: {''train'': [...], ''val'': [...]}}` for fast
          lookup.'
        reason: The script must know exactly which JSON file corresponds to which
          material to load the correct image file paths for training and validation.
        text: Read the split_datasets node output to obtain `material_names`, `train_split_json_paths`,
          and `validation_split_json_paths`. Ensure the ordering of these three lists
          is identical, establishing a deterministic material sequence.
      - complexity: LOW
        impact: MEDIUM
        method: Create a mapping `optimizer_cls = getattr(torch.optim, base_optimizer)`;
          instantiate `optimizer = optimizer_cls(model.parameters(), lr=base_learning_rate)`.
        reason: The baseline must share the same optimizer and learning‑rate regime
          as the base model to make a fair comparison; the incremental_* hyper‑parameters
          are specific to CL‑based methods and should not be used here.
        text: 'Extract hyper‑parameters from configure_training_hyperparameters: use
          `base_optimizer`, `base_learning_rate`, `base_batch_size`, and `base_epochs`
          as the training schedule for the naive fine‑tuning baseline (these values
          are appropriate because no replay or prompt learning is involved).'
      - complexity: HIGH
        impact: HIGH
        method: Implement a reusable function `train_one_material(model, train_loader,
          val_loader, optimizer, epochs)` that returns `best_checkpoint_path` and
          `best_val_accuracy`. Use `torch.save(model.state_dict(), path)`. Ensure
          deterministic seeding (`torch.manual_seed(42)`) for reproducibility.
        reason: 'These steps constitute the core naive fine‑tuning loop: fully unfreeze,
          train on the new material, checkpoint the best model, and move on without
          any memory replay or prompt updates.'
        text: "For each material in `material_names` (loop order preserved from split_datasets):\n\
          \   a. Build a training `DataLoader` from the material's train split using\
          \ `base_batch_size` and standard augmentations (random flip, rotation) that\
          \ were applied during preprocessing.\n   b. Build a validation `DataLoader`\
          \ from the material's validation split (no augmentation, deterministic transforms).\n\
          \   c. Reset the optimizer state at the start of each material to avoid\
          \ cross‑material momentum leakage.\n   d. Run a training epoch loop for\
          \ `base_epochs` iterations:\n      i.   Forward pass, compute cross‑entropy\
          \ loss against ground‑truth labels.\n      ii.  Back‑propagation (`loss.backward()`),\
          \ optimizer step, and zero gradients.\n      iii. Optionally log training\
          \ loss and accuracy to a CSV/logger.\n   e. After each epoch, evaluate on\
          \ the validation set; keep the checkpoint with the highest validation accuracy\
          \ for that material.\n   f. Save the selected checkpoint to `checkpoints/{material}_epoch{best_epoch}.pth`\
          \ and record the path in `trained_checkpoints`.\n   g. Append `material`\
          \ to `materials_fine_tuned` and `base_epochs` to `epochs_per_material`.\n\
          \   h. Store the best validation accuracy for the material; if the material\
          \ is the last in the sequence, also assign it to `final_validation_accuracy`.\n"
      - complexity: LOW
        impact: MEDIUM
        method: 'Use Python''s `try: ... except Exception as e: logging.error(e);
          training_success = False` pattern.'
        reason: Provides a clear boolean flag required by downstream evaluation nodes
          and guarantees graceful failure handling.
        text: Wrap the entire material‑wise training loop in a try/except block; on
          any exception set `training_success = False` and break, otherwise after
          the loop set `training_success = True`.
      - complexity: LOW
        impact: MEDIUM
        method: '`assert len(trained_checkpoints) == len(materials_fine_tuned) ==
          len(epochs_per_material) == len(material_names)`.'
        reason: Ensures output consistency with the schema and prevents downstream
          nodes from encountering shape mismatches.
        text: After all materials have been processed, verify that the lengths of
          `trained_checkpoints`, `materials_fine_tuned`, and `epochs_per_material`
          are identical and match the number of materials; raise an assertion error
          if mismatched.
      - complexity: MEDIUM
        impact: LOW
        method: Create a dictionary with keys matching the output_structure, `json.dump`
          it with indent=2, and store under `outputs/` directory.
        reason: Facilitates reproducibility, auditability, and easy consumption by
          `compute_accuracy_and_forgetting_metrics` which expects the checkpoint list
          and material order.
        text: Log a summary JSON file (`baseline_fine_tuning_summary.json`) containing
          all output fields for provenance, and optionally upload the file to the
          experiment tracking system (e.g., MLflow, Weights & Biases).
    prompt: Provide a training script outline that, for each new material, unfreezes
      all parameters, trains on the material's data, and proceeds to the next material
      without replay or prompts.
