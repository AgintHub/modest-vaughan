          while also logging per‑material accuracies for later analysis.
      - complexity: LOW
        impact: MEDIUM
        method: 'Use `torch.save({''prompt_state_dict'': prompt_pool.state_dict(),
          ''delta_state_dict'': delta_head.state_dict(), ''optimizer_prompt'': optimizer_prompt.state_dict(),
          ''optimizer_delta'': optimizer_delta.state_dict(), ''buffer_meta'': buffer_meta},
          checkpoint_path)`.'
        reason: Allows recovery from interruptions and enables later analysis of intermediate
