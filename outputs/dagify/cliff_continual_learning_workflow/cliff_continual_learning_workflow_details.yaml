  implement_cosine_similarity_gate:
    agent: false
    description: Build a gate that selects and weights prompts based on cosine similarity
      between input features and prompt embeddings.
    name: implement_cosine_similarity_gate
    nodes_depended_on:
    - implement_prompt_pool_structure
    nodes_dependent_on: []
    output_structure:
    - description: Pseudo‑code implementation of the cosine‑similarity gating mechanism.
      key: pseudo_code
      type: str
    - description: Cosine similarity scores between the backbone output feature vector
        and each prompt embedding.
      key: similarity_scores
      type: float
    - description: Softmax‑normalized weights derived from the similarity scores.
      key: softmax_weights
      type: float
    - description: Aggregated prompt vector obtained by the weighted sum of prompt
        embeddings using the softmax weights.
      key: weighted_prompt_vector
      type: float
    prd:
      bullets:
      - complexity: LOW
        impact: HIGH
        method: Import the prompt pool variable (e.g., `material_prompts`) from the
          model's state dictionary; ensure it is a tensor of shape (num_materials,
          D).
        reason: The gate must have direct access to the raw prompt embeddings to compute
          similarity with the backbone output.
        text: Load the prompt pool metadata produced by `implement_prompt_pool_structure`
          (variable name, dimensionality D, list of material IDs, and the learnable
          tensor containing all prompt embeddings).
      - complexity: LOW
        impact: HIGH
        method: Apply `f_norm = f / (torch.norm(f, p=2) + 1e-8)` using the same precision
          as the prompt embeddings.
        reason: Cosine similarity requires both vectors to be unit‑norm; normalizing
          the backbone output eliminates scale bias.
        text: 'During the forward pass, retrieve the backbone feature vector `f` for
          the current input image (shape: [D]), ensuring it is L2‑normalized before
          similarity computation.'
      - complexity: LOW
        impact: MEDIUM
        method: Compute `P_norm = material_prompts / (torch.norm(material_prompts,
          dim=1, keepdim=True) + 1e-8)` once per training step or cache if static.
        reason: Consistent normalization across prompts guarantees that the dot product
          equals cosine similarity.
        text: 'L2‑normalize each prompt embedding in the pool to obtain `P_norm` (shape:
          [num_materials, D]).'
      - complexity: LOW
        impact: HIGH
        method: Use PyTorch/TF tensor ops; ensure dtype consistency (float32). Store
          the result as `similarity_scores`.
        reason: Matrix‑vector multiplication is highly efficient on GPUs and yields
          the exact cosine similarity for each prompt.
        text: 'Compute cosine similarity scores by taking the matrix‑vector product
          between `P_norm` and the normalized backbone vector `f_norm`: `scores =
          torch.matmul(P_norm, f_norm)` resulting in a 1‑D tensor of length `num_materials`.'
      - complexity: LOW
        impact: MEDIUM
        method: Implement as a separate function `softmax_weights(scores, temperature=0.1)`.
          Store the output as `softmax_weights`.
        reason: Softmax converts raw similarities into a probability distribution
          that can be used for weighted aggregation; temperature controls sharpness.
        text: 'Apply a temperature‑scaled softmax to the similarity scores to obtain
          attention weights: `weights = torch.softmax(scores / temperature, dim=0)`.
          Choose a default temperature of 0.1 to sharpen the distribution.'
      - complexity: LOW
        impact: HIGH
        method: Broadcast `weights` to shape `[num_materials, 1]`, multiply with `material_prompts`,
          then sum over the material dimension. Store as `weighted_prompt_vector`.
        reason: Using the original embeddings preserves their learned magnitude while
          still being guided by similarity‑based attention.
        text: 'Compute the weighted prompt aggregation by performing a weighted sum
          of the original (non‑normalized) prompt embeddings: `weighted_prompt = torch.sum(weights.unsqueeze(1)
          * material_prompts, dim=0)`.'
      - complexity: LOW
        impact: MEDIUM
        method: Construct a multi‑line string with clear comments, variable names
          matching the steps, and include optional type hints. Example provided in
          the pseudo‑code field.
        reason: The node contract requires both concrete numeric outputs for downstream
          computation and a human‑readable pseudo‑code description for documentation.
        text: Package the four outputs (`pseudo_code`, `similarity_scores`, `softmax_weights`,
          `weighted_prompt_vector`) into the node's result structure. The `pseudo_code`
          field should contain a language‑agnostic, step‑by‑step script reflecting
          the operations above.
      - complexity: LOW
        impact: MEDIUM
        method: Use `assert torch.allclose(weights.sum(), torch.tensor(1.0), atol=1e-5)`
          and shape checks; raise informative errors if violated.
        reason: Early detection of shape or numerical errors prevents downstream crashes
          in incremental training loops.
        text: 'Add sanity‑check assertions: verify that `similarity_scores` length
          equals `number_of_materials`, that `softmax_weights` sum to 1 (within tolerance),
          and that `weighted_prompt_vector` shape matches `prompt_dimension` D.'
    prompt: Write pseudo‑code for a cosine‑similarity gate that computes similarity
      scores between the backbone output and each prompt embedding, applies softmax,
      and produces a weighted prompt aggregation.
